# Builds the release APK for Android.
# - Run it by hand from the Actions tab (workflow_dispatch), or
# - push the final-submission tag.
# The APK is attached to the final-submission GitHub release.
name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['final-submission']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk souq.apk
      - uses: actions/upload-artifact@v4
        with:
          name: souq-apk
          path: souq.apk
      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: final-submission
          name: Souq final submission
          files: souq.apk
